<!DOCTYPE html>

<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Finanfit 회원가입</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            font-family:
                Arial,
                "Noto Sans KR",
                sans-serif;

            background: #f7faf9;

        }


        header {

            height: 78px;

            background: white;

            display: flex;

            align-items: center;

            padding: 0 50px;

            border-bottom:
                1px solid #eee;

        }


        header img {

            width: 180px;

        }


        .container {

            width: 90%;

            max-width: 850px;

            margin:
                45px auto;

            background: white;

            border-radius: 25px;

            padding: 45px;

            box-shadow:
                0 14px 50px
                rgba(0,0,0,0.07);

        }


        h1 {

            margin-top: 0;

            font-size: 30px;

        }


        .desc {

            color: #777;

            margin-bottom: 35px;

        }


        .form-grid {

            display: grid;

            grid-template-columns:
                1fr
                1fr;

            gap:
                22px
                20px;

        }


        .full {

            grid-column:
                1 / -1;

        }


        label {

            display: block;

            font-weight: bold;

            font-size: 14px;

            margin-bottom: 8px;

        }


        input,
        select {

            width: 100%;

            height: 50px;

            border:
                1px solid #ddd;

            border-radius: 11px;

            padding:
                0 14px;

            font-size: 15px;

            background: white;

        }


        input:focus,
        select:focus {

            outline: none;

            border-color:
                #00a89c;

            box-shadow:
                0 0 0 3px
                rgba(
                    0,
                    168,
                    156,
                    0.1
                );

        }


        .file {

            padding-top: 12px;

        }


        button {

            width: 100%;

            height: 54px;

            border: none;

            border-radius: 12px;

            background:
                linear-gradient(
                    135deg,
                    #00a89c,
                    #00c8aa
                );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 15px;

        }


        .login {

            text-align: center;

            margin-top: 22px;

            color: #777;

        }


        .login a {

            color: #00a89c;

            font-weight: bold;

            text-decoration: none;

        }


        .error {

            background: #fff1f1;

            color: #d93025;

            padding: 13px;

            border-radius: 10px;

            margin-bottom: 20px;

        }


        @media(max-width: 650px) {

            .form-grid {

                grid-template-columns: 1fr;

            }


            .full {

                grid-column: auto;

            }

        }

    </style>

</head>


<body>


<header>

    <a href="/">

        <img
            src="/static/logo.png"
            alt="Finanfit"
        >

    </a>

</header>


<div class="container">


    <h1>
        Finanfit 회원가입
    </h1>


    <p class="desc">
        몇 가지 정보를 입력하면 더 정확한 금융상품을 추천해드려요.
    </p>


    {% if error %}

    <div class="error">
        {{ error }}
    </div>

    {% endif %}


    <form
        action="/signup"
        method="post"
        enctype="multipart/form-data"
    >


        <div class="form-grid">


            <div>

                <label>
                    아이디
                </label>

                <input
                    name="username"
                    required
                >

            </div>


            <div>

                <label>
                    비밀번호
                </label>

                <input
                    name="password"
                    type="password"
                    required
                >

            </div>


            <div>

                <label>
                    이름
                </label>

                <input
                    name="name"
                    required
                >

            </div>


            <div>

                <label>
                    이메일
                </label>

                <input
                    name="email"
                    type="email"
                    required
                >

            </div>


            <div>

                <label>
                    나이
                </label>

                <input
                    name="age"
                    type="number"
                    min="14"
                    max="100"
                    required
                >

            </div>


            <div>

                <label>
                    성별
                </label>

                <select
                    name="gender"
                    required
                >

                    <option value="">
                        선택
                    </option>

                    <option value="남성">
                        남성
                    </option>

                    <option value="여성">
                        여성
                    </option>

                    <option value="기타">
                        기타
                    </option>

                </select>

            </div>


            <div>

                <label>
                    투자성향
                </label>

                <select
                    name="investment_type"
                    required
                >

                    <option value="">
                        투자성향 선택
                    </option>

                    <option value="안정형">
                        안정형
                    </option>

                    <option value="안정추구형">
                        안정추구형
                    </option>

                    <option value="위험중립형">
                        위험중립형
                    </option>

                    <option value="적극투자형">
                        적극투자형
                    </option>

                    <option value="공격투자형">
                        공격투자형
                    </option>

                </select>

            </div>


            <div>

                <label>
                    직업
                </label>

                <select
                    name="job"
                    required
                >

                    <option value="">
                        직업 선택
                    </option>

                    <option value="대학생">
                        대학생
                    </option>

                    <option value="취업준비생">
                        취업준비생
                    </option>

                    <option value="직장인">
                        직장인
                    </option>

                    <option value="공무원">
                        공무원
                    </option>

                    <option value="공기업">
                        공기업
                    </option>

                    <option value="자영업">
                        자영업
                    </option>

                    <option value="프리랜서">
                        프리랜서
                    </option>

                    <option value="기타">
                        기타
                    </option>

                </select>

            </div>


            <div class="full">

                <label>
                    연소득
                    (만원)
                </label>

                <input
                    name="income"
                    type="number"
                    min="0"
                    placeholder="예: 4000"
                    required
                >

            </div>


            <div class="full">

                <label>
                    프로필 사진
                </label>

                <input
                    class="file"
                    name="profile_image"
                    type="file"
                    accept="image/*"
                >

            </div>


        </div>


        <button type="submit">
            가입하고 추천받기
        </button>


    </form>


    <div class="login">

        이미 회원인가요?

        <a href="/">
            로그인
        </a>

    </div>


</div>


</body>

</html>
