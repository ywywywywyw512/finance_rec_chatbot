<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Finanfit 로그인</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                Arial,
                "Noto Sans KR",
                sans-serif;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #f2fffc,
                    #ffffff
                );

            color: #222;

        }


        header {

            height: 78px;

            background: white;

            display: flex;

            align-items: center;

            padding: 0 50px;

            border-bottom:
                1px solid #eeeeee;

        }


        .logo {

            width: 180px;

        }


        .page {

            min-height:
                calc(100vh - 78px);

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 40px;

        }


        .container {

            width: 100%;

            max-width: 1050px;

            display: grid;

            grid-template-columns:
                1.2fr
                0.8fr;

            gap: 90px;

            align-items: center;

        }


        .intro h1 {

            font-size: 46px;

            line-height: 1.3;

            margin-bottom: 20px;

            color: #222;

        }


        .intro h1 span {

            color: #00a89c;

        }


        .intro p {

            color: #777;

            font-size: 18px;

            line-height: 1.8;

        }


        .login-card {

            background: white;

            border-radius: 26px;

            padding: 42px;

            box-shadow:
                0 18px 60px
                rgba(0,0,0,0.08);

        }


        .login-card h2 {

            font-size: 28px;

            margin-bottom: 8px;

        }


        .login-card .subtitle {

            color: #888;

            margin-bottom: 30px;

        }


        label {

            font-size: 14px;

            font-weight: bold;

            display: block;

            margin-bottom: 8px;

        }


        input {

            width: 100%;

            height: 52px;

            border:
                1px solid #ddd;

            border-radius: 12px;

            padding: 0 15px;

            font-size: 15px;

            margin-bottom: 18px;

            outline: none;

        }


        input:focus {

            border-color:
                #00a89c;

            box-shadow:
                0 0 0 3px
                rgba(
                    0,
                    168,
                    156,
                    0.12
                );

        }


        button {

            width: 100%;

            height: 54px;

            border: 0;

            border-radius: 13px;

            background:
                linear-gradient(
                    135deg,
                    #00a89c,
                    #00c8aa
                );

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            margin-top: 5px;

        }


        button:hover {

            transform:
                translateY(-1px);

            box-shadow:
                0 7px 18px
                rgba(
                    0,
                    168,
                    156,
                    0.24
                );

        }


        .signup-link {

            text-align: center;

            margin-top: 22px;

            color: #777;

        }


        .signup-link a {

            color: #00a89c;

            font-weight: bold;

            text-decoration: none;

        }


        .error {

            background: #fff0f0;

            color: #d93025;

            padding: 12px;

            border-radius: 10px;

            margin-bottom: 18px;

            font-size: 14px;

        }


        @media(max-width: 850px) {

            .container {

                grid-template-columns:
                    1fr;

                gap: 35px;

            }


            .intro {

                text-align: center;

            }

        }

    </style>

</head>


<body>


<header>

    <img
        class="logo"
        src="/static/logo.png"
        alt="Finanfit"
    >

</header>


<div class="page">


    <div class="container">


        <section class="intro">

            <h1>
                나에게 딱 맞는 금융,
                <br>
                <span>Finanfit</span>이 찾아드릴게요.
            </h1>


            <p>
                나이, 직업, 소득 그리고 투자성향을 바탕으로
                <br>
                나에게 어울리는 금융상품을 쉽고 빠르게 추천받아보세요.
            </p>

        </section>


        <section class="login-card">

            <h2>
                로그인
            </h2>

            <p class="subtitle">
                Finanfit에 오신 것을 환영합니다.
            </p>


            {% if error %}

            <div class="error">
                {{ error }}
            </div>

            {% endif %}


            <form
                method="post"
                action="/login"
            >


                <label>
                    아이디
                </label>


                <input
                    type="text"
                    name="username"
                    placeholder="아이디를 입력하세요"
                    required
                >


                <label>
                    비밀번호
                </label>


                <input
                    type="password"
                    name="password"
                    placeholder="비밀번호를 입력하세요"
                    required
                >


                <button type="submit">
                    로그인
                </button>


            </form>


            <div class="signup-link">

                아직 회원이 아니신가요?

                <a href="/signup">
                    회원가입
                </a>

            </div>


        </section>


    </div>


</div>


</body>

</html>
